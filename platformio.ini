; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200


; --- S2 ---
[env:esp32dev]
board = esp32dev
upload_speed = 921600
# Flash Settings
board_build.flash_mode = qio
board_build.f_flash = 40000000L
board_build.partitions = huge_app.csv


[env:esp32devv2]
board = esp32dev
upload_speed = 921600
; Flash and Upload Settings
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
board_build.f_flash = 80000000L

lib_deps = 
;	madhephaestus/ESP32Servo @ ^3.0.5

; Partition Scheme (Choose one based on your storage needs)
; Use a default 4MB partition (e.g., OTA with SPIFFS)
board_build.partitions = default.csv

; OR, use a partition with more app space and no OTA
; board_build.partitions = huge_app.csv
build_src_filter = -<*> +<main.cpp>


; --- HC-05 emulator: classic ESP32 (BluetoothSerial <-> UART2) ---
[env:bt_bridge]
board = esp32dev
upload_speed = 921600
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<bt_bridge.cpp>

; --- Test controller (plays the role of the Arduino), classic ESP32 ---
[env:bt_tester]
board = esp32dev
upload_speed = 921600
build_src_filter = -<*> +<bt_tester.cpp>


